name: Actionlint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: the defaults are the policy this repository already had.
  actionlint:
    uses: rhalbersma/cpp-ci/.github/workflows/actionlint.yml@cb677f685fe5c4d039883f6dbe6ee5ef6938481a # v0.2.1
