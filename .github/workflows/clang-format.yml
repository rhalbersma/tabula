name: Clang-Format

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The style is the xstd family's .clang-format, the same file xstd-misc, xstd-ints and xstd-bits carry.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Its own tier, deliberately left at stable: a formatter release reformats
  # the code base, which is not something a compiler bump should decide.
  clang_format:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-format.yml@480aa17d38efd5c1641b861e9e1a0c6df053a451 # v0.10.3
    with:
      # example/ too: the shared default is "include test", but this
      # repository hand-writes a tree of examples as well.
      paths: include test example
