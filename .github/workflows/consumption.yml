name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: the three models live under test/consumer, which is where the
  # shared workflow looks.
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@480aa17d38efd5c1641b861e9e1a0c6df053a451 # v0.10.3
