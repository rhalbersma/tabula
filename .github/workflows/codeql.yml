name: CodeQL

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  codeql:
    uses: rhalbersma/cpp-ci/.github/workflows/codeql.yml@e2886b13f6fcd1eceb231652f816b016de41be1d # v0.8.1
