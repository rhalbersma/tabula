name: Scorecard

# Read-only at workflow level. The write grants the analysis needs are on the
# job below rather than here: the OpenSSF webapp that ingests published results
# verifies a workflow file first, and for a job that calls a reusable workflow
# the path in the OIDC certificate names the shared workflow, not this stub --
# so this placement is least privilege rather than a requirement. cpp-ci moved
# its own grants off the workflow level in v0.3.1, which is what unblocked
# publishing; this keeps the caller's side in the same shape, as xstd's is.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: rhalbersma/cpp-ci/.github/workflows/scorecard.yml@847e9ccde5651430e1dbe2cef53c85c1d3df0b90 # v0.6.1
