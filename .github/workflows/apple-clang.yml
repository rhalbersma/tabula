name: Apple Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Two rungs, not three: Apple publishes no Clang trunk, and the shared
  # workflow drops the development rung with a notice rather than failing.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@d2d660725227972f5ac9bdd65efda9d485fb30b7 # v0.15.0
