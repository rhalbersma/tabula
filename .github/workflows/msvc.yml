name: MSVC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Two rungs, not three. The shared ladder's stable rung for this family is
  # VS 2022, and this repository deliberately does not carry it: 2022 is the
  # 17.x line, in maintenance, so the 18.7.0 fix below is one it will never
  # receive. 2026 and 2026-Preview have a path to passing; 2022 has none, and
  # a leg that cannot ever go green is not worth a runner. The README says
  # the same thing with a dash in the MSVC Stable column.
  #
  # The toolset input is left at its default, which is the MSVC one.
  #
  # Expected red, and documented as such in the README: cl rejects
  # basic_compass<chequer{...}> on an ambiguous partial specialization it
  # reports fixed in VS 18.7.0, which the runner image does not yet carry
  # (actions/runner-images#14130). Deliberately not a required check, so the
  # failure stays visible without blocking a merge. Sharing the workflow does
  # not change that -- it is the same compiler on the same image.
  msvc:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@761f20d7d737d4e0c5a942eb2f1becf8e8edea75 # v0.3.1
    with:
      tiers: qualification,development
