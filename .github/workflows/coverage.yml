name: Coverage

# id-token for Codecov's tokenless upload; the shared workflow cannot exceed
# what is granted here.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The Codecov CLI only queues an upload, so a report dropped on their side
  # greys the badge with every leg green; the daily re-upload self-heals that.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  coverage:
    uses: rhalbersma/cpp-ci/.github/workflows/coverage.yml@0033891bc09c0ba200d597a3e5a619796c93e578 # v0.5.1
    with:
      # example/ as well as the shared default: unlike xstd, this repository
      # ships a tree of examples, which are demonstrations rather than
      # library code and have no business in the library's coverage figure.
      exclude: "test/.* example/.* build/.*"
      # Reported, not enforced. The gate is aspirational while the test suite
      # is still being written -- today's figure is 52.6% of lines and 24.6%
      # of branches -- and .github/codecov.yml already marks both Codecov
      # statuses informational for exactly that reason. The shared workflow is
      # called with "uses", which cannot carry continue-on-error, so the two
      # zeroes are what keeps this job reporting the real number rather than
      # failing on a gap that only new tests can close. Raise them as coverage
      # is built up.
      fail_under_line: 0
      fail_under_branch: 0
