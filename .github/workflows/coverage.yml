name: Coverage

# id-token for Codecov's tokenless upload; the shared workflow cannot exceed
# what is granted here.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The Codecov CLI only queues an upload, so a report dropped on their side
  # greys the badge with every leg green; the daily re-upload self-heals that.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  coverage:
    uses: rhalbersma/cpp-ci/.github/workflows/coverage.yml@e2886b13f6fcd1eceb231652f816b016de41be1d # v0.8.1
    with:
      # example/ as well as the shared default: unlike xstd, this repository
      # ships a tree of examples, which are demonstrations rather than
      # library code and have no business in the library's coverage figure.
      exclude: "test/.* example/.* build/.*"
      # A ratchet, not a target. These are where coverage stands today, so the
      # job fails on any commit that lowers it, and 100 stays the destination
      # rather than the gate -- see #56. Raise both whenever new tests clear a
      # margin; never lower them.
      fail_under_line: 52.6
      fail_under_branch: 24.6
