# Aspires to the same 100% bar xstd already meets, and holds a ratchet in the
# meantime: the Coverage workflow passes fail_under_line and fail_under_branch
# at today's figures, so nothing may lower them. These two statuses stay
# informational only because their target is the 100% destination rather than
# that floor -- a blocking 100% here would fail every PR. Drop `informational`
# once the workflow's thresholds reach 100; #56 tracks getting there.
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        informational: true
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: true

comment: false
