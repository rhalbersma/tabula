# Aspires to the same 100% bar xstd already meets. tabula's existing tests
# are nowhere near it yet (52.6% lines / 24.6% branches), so both status
# checks are informational: they report the real number on every PR without
# turning red and blocking on a gap that needs deliberate new tests to
# close. The Coverage workflow takes the same line from the other side,
# passing fail_under_line: 0 and fail_under_branch: 0 to the shared
# workflow. Raise those and drop `informational: true` together, once
# coverage catches up.
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        informational: true
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: true

comment: false
